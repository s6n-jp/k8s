apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paseo-hub-ingress
  namespace: paseo-hub
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Executions stream over SSE, so keep the upstream connection open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: paseo.k8s.s6n.jp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paseo-hub
            port:
              number: 80
  tls:
  - hosts:
    - paseo.k8s.s6n.jp
    secretName: paseo-hub-ingress-tls
