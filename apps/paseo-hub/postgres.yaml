apiVersion: v1
kind: Service
metadata:
  name: paseo-hub-postgres
  namespace: paseo-hub
  labels:
    app.kubernetes.io/name: paseo-hub
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: paseo-hub
    app.kubernetes.io/component: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paseo-hub-postgres
  namespace: paseo-hub
  labels:
    app.kubernetes.io/name: paseo-hub
    app.kubernetes.io/component: postgres
  annotations:
    ignore-check.kube-linter.io/unset-cpu-requirements: "CPU limits cause throttling; requests are set"
spec:
  serviceName: paseo-hub-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo-hub
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo-hub
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:17.10-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: paseo_hub
        - name: POSTGRES_USER
          value: paseo
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paseo-hub-postgres
              key: password
        # The volume root is an ext4 mount and holds lost+found, so initdb needs a subdirectory.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "paseo", "-d", "paseo_hub"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "paseo", "-d", "paseo_hub"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: nfs-client
      resources:
        requests:
          storage: 8Gi
