apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paseo-hub
  namespace: argocd
spec:
  project: default
  destination:
    namespace: paseo-hub
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/s6n-jp/k8s
    targetRevision: main
    path: apps/paseo-hub
    directory:
      # Managed by whatever syncs apps/, not by this Application itself.
      exclude: app.yaml
  revisionHistoryLimit: 1
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
