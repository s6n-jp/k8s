apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
  - name: default
    namespace: gateway
    sectionName: https
  hostnames:
  - immich.k8s.s6n.jp
  rules:
  - backendRefs:
    - name: immich-server
      port: 2283
    # Envoy's default 15s route timeout covers the whole response and would cut uploads and streams.
    timeouts:
      request: 0s
