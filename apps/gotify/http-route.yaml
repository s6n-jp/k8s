apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: default
    namespace: gateway
    sectionName: https
  hostnames:
  - gotify.k8s.s6n.jp
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: gotify
      port: 80
      weight: 1
    # Envoy's default 15s route timeout covers the whole response and would cut uploads and streams.
    timeouts:
      request: 0s
