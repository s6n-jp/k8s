apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: default
    namespace: gateway
    sectionName: https
  hostnames:
  - argocd.k8s.s6n.jp
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: argocd-server
      port: 443
      weight: 1
    timeouts:
      request: 0s
---
# argocd-server serves TLS itself (argocd-server-cert); verify it rather than switching it to insecure mode.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: argocd-server
    sectionName: https
  validation:
    hostname: argocd.k8s.s6n.jp
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: letsencrypt-roots
