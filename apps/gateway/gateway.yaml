apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
  # The router forwards to these addresses.
  - type: IPAddress
    value: 172.16.8.250
  - type: IPAddress
    value: "2001:f70:bf60:da00:c0:ffee::"
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.k8s.s6n.jp"
    tls:
      mode: Terminate
      certificateRefs:
      - name: default-certificate-tls
    allowedRoutes:
      namespaces:
        from: All
