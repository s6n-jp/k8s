apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: dual-stack
  namespace: gateway
spec:
  service:
    ipFamilyPolicy: RequireDualStack
    ipFamilies:
    - IPv4
    - IPv6
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: dual-stack
    namespace: gateway
