apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
  - name: default
    namespace: gateway
    sectionName: https
  hostnames:
  - home-assistant.k8s.s6n.jp
  rules:
  - backendRefs:
    - name: home-assistant
      port: 8080
    # Envoy's default 15s route timeout covers the whole response and would cut uploads and streams.
    timeouts:
      request: 0s
