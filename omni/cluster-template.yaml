kind: Cluster
name: k8s-s6n-jp
kubernetes:
  version: v1.37.1
talos:
  version: v1.14.4
features:
  diskEncryption: true
  enableWorkloadProxy: true
  useEmbeddedDiscoveryService: true
  backupConfiguration:
    interval: 24h0m0s
patches:
  - name: enable-ipv6
    inline:
      cluster:
        network:
          # Nodes registered before the IPv6 pod subnet was added must be deleted and re-registered
          # to get an IPv6 podCIDR; sync manifests (enabling IPv6 on flannel) only after all have one.
          podSubnets:
            - 10.244.0.0/16
            - fd00:10:244::/48
          serviceSubnets:
            - 10.96.0.0/12
            - fd00:10:96::/112
  # Cilium (apps/cilium) replaces flannel and kube-proxy.
  # Omni generates the legacy v1alpha1 .cluster.network.cni / .cluster.proxy, so the
  # KubeFlannelCNIConfig / KubeProxyConfig documents don't apply here.
  - name: disable-default-cni
    inline:
      cluster:
        network:
          cni:
            name: none
  - name: disable-kube-proxy
    inline:
      cluster:
        proxy:
          disabled: true
---
kind: ControlPlane
machines:
  - f067d9a8-48d1-4460-bfca-fbda8777e57e
---
kind: Workers
machines:
  - a34cff71-ac78-46d9-914f-16a707a8811c
  - 6bb0f8f4-76d4-46b2-b3e7-853b95c69fca
---
kind: Machine
name: f067d9a8-48d1-4460-bfca-fbda8777e57e # control-0.k8s.s6n.jp
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Machine
name: a34cff71-ac78-46d9-914f-16a707a8811c # worker-0.k8s.s6n.jp
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Machine
name: 6bb0f8f4-76d4-46b2-b3e7-853b95c69fca # worker-1.k8s.s6n.jp
systemExtensions:
  - siderolabs/qemu-guest-agent
